<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Raksha - EMI & Settlement</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#0b3d91;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:650px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

input,
select{
  width:100%;
  padding:13px;
  margin:8px 0 14px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#0b3d91;
  color:white;
  font-size:16px;
  margin-top:8px;
}

.back{
  background:#555;
  margin-bottom:18px;
}

.result{
  margin-top:18px;
  padding:16px;
  background:#eef4ff;
  border-radius:10px;
  line-height:1.8;
}

.success{
  color:#2e7d32;
  font-weight:bold;
}

.warning{
  color:#f57f17;
  font-weight:bold;
}

.history{
  padding:12px;
  margin-top:10px;
  background:#f7f7f7;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>💰 Vehicle Raksha</h1>
<p>EMI & Settlement Management</p>
</header>

<div class="container">

<button class="back" onclick="history.back()">← Back</button>

<div class="card">

<h2>🏦 Loan Details</h2>

<label>Finance Company</label>
<input id="finance" placeholder="Finance company">

<label>Loan Amount (₹)</label>
<input id="loan" type="number" placeholder="500000">

<label>Annual Interest Rate (%)</label>
<input id="rate" type="number" step="0.01" placeholder="10">

<label>Total Tenure (Months)</label>
<input id="tenure" type="number" placeholder="60">

<button onclick="calculateLoan()">
Calculate EMI
</button>

<div id="loanResult"></div>

</div>


<div class="card">

<h2>💳 EMI Payment</h2>

<label>EMI Paid</label>
<input id="paidEmi" type="number" placeholder="1">

<button onclick="recordPayment()">
Record EMI Payment
</button>

<div id="paymentResult"></div>

</div>


<div class="card">

<h2>🤝 Settlement</h2>

<label>Settlement Amount (₹)</label>
<input id="settlement" type="number" placeholder="250000">

<select id="settlementStatus">
<option>Negotiation</option>
<option>Offer Received</option>
<option>Approved</option>
<option>Paid</option>
<option>Rejected</option>
</select>

<button onclick="saveSettlement()">
Save Settlement
</button>

<div id="settlementResult"></div>

</div>


<div class="card">

<h2>📜 Payment History</h2>

<div id="history">
No payments recorded yet.
</div>

</div>

</div>


<script>


}
<script>

const selectedId =
  localStorage.getItem("vehicleRakshaSelected");

const vehicles =
  JSON.parse(
    localStorage.getItem("vehicleRakshaVehicles") || "[]"
  );

const vehicle =
  vehicles.find(
    v => String(v.id) === String(selectedId)
  );

let loanData = null;
let paymentCount = 0;
let paymentHistory = [];


function storageKey(){

  return "emiData_" + vehicle.id;

}


function calculateLoan(){

  if(!vehicle){

    alert("Please select a vehicle first.");
    return;

  }

  const finance =
    document.getElementById("finance").value.trim();

  const P =
    parseFloat(
      document.getElementById("loan").value
    );

  const annualRate =
    parseFloat(
      document.getElementById("rate").value
    );

  const n =
    parseInt(
      document.getElementById("tenure").value
    );


  if(
    finance === "" ||
    !P ||
    annualRate < 0 ||
    !n
  ){

    alert("Please enter all loan details.");
    return;

  }


  const r =
    annualRate / 12 / 100;

  let emi;


  if(r === 0){

    emi = P / n;

  }else{

    emi =
      (P * r * Math.pow(1+r,n)) /
      (Math.pow(1+r,n)-1);

  }


  const total =
    emi * n;


  loanData = {

    finance: finance,
    loan: P,
    rate: annualRate,
    tenure: n,
    emi: emi,
    total: total

  };


  saveData();


  document.getElementById(
    "loanResult"
  ).innerHTML = `

    <div class="result">

      <strong>Finance:</strong>
      ${finance}

      <br>

      <strong>Monthly EMI:</strong>
      ₹${emi.toFixed(2)}

      <br>

      <strong>Total Payment:</strong>
      ₹${total.toFixed(2)}

      <br>

      <strong>Total Interest:</strong>
      ₹${(total-P).toFixed(2)}

      <br><br>

      <span class="success">
      ✓ Loan details saved
      </span>

    </div>

  `;

}


function recordPayment(){

  if(!loanData){

    alert("Please calculate the loan first.");
    return;

  }


  const paid =
    parseInt(
      document.getElementById("paidEmi").value
    );


  if(!paid || paid < 1){

    alert("Enter valid EMI number.");
    return;

  }


  paymentCount += paid;


  if(paymentCount > loanData.tenure){

    paymentCount =
      loanData.tenure;

  }


  const remaining =
    loanData.tenure -
    paymentCount;


  const outstanding =
    remaining *
    loanData.emi;


  const payment = {

    amount: paid,

    date:
      new Date().toLocaleString()

  };


  paymentHistory.unshift(payment);


  saveData();


  document.getElementById(
    "paymentResult"
  ).innerHTML = `

    <div class="result">

      <span class="success">
      ✓ EMI payment recorded
      </span>

      <br>

      <strong>Total Paid EMI:</strong>
      ${paymentCount}

      <br>

      <strong>Remaining EMI:</strong>
      ${remaining}

      <br>

      <strong>Estimated Outstanding:</strong>
      ₹${outstanding.toFixed(2)}

    </div>

  `;


  renderHistory();

}


function saveSettlement(){

  if(!vehicle){

    alert("Please select a vehicle first.");
    return;

  }


  const amount =
    parseFloat(
      document.getElementById(
        "settlement"
      ).value
    );


  const status =
    document.getElementById(
      "settlementStatus"
    ).value;


  if(!amount){

    alert("Enter settlement amount.");
    return;

  }


  if(!loanData){

    alert("Please calculate the loan first.");
    return;

  }


  loanData.settlementAmount =
    amount;

  loanData.settlementStatus =
    status;


  saveData();


  document.getElementById(
    "settlementResult"
  ).innerHTML = `

    <div class="result">

      <strong>
      Settlement Amount:
      </strong>

      ₹${amount.toFixed(2)}

      <br>

      <strong>
      Status:
      </strong>

      ${status}

      <br><br>

      <span class="success">
      ✓ Settlement saved
      </span>

    </div>

  `;

}


function saveData(){

  if(!vehicle){
    return;
  }


  const data = {

    ...loanData,

    paymentCount:
      paymentCount,

    remainingEmi:
      loanData ?
      loanData.tenure-paymentCount :
      0,

    outstanding:
      loanData ?
      (loanData.tenure-paymentCount)
      * loanData.emi :
      0,

    paymentHistory:
      paymentHistory

  };


  localStorage.setItem(
    storageKey(),
    JSON.stringify(data)
  );

}


function loadData(){

  if(!vehicle){

    alert(
      "Please select a vehicle from Dashboard first."
    );

    return;

  }


  const saved =
    JSON.parse(
      localStorage.getItem(
        storageKey()
      ) || "null"
    );


  if(!saved){
    return;
  }


  loanData = {

    finance:
      saved.finance,

    loan:
      saved.loan,

    rate:
      saved.rate,

    tenure:
      saved.tenure,

    emi:
      saved.emi,

    total:
      saved.total,

    settlementAmount:
      saved.settlementAmount,

    settlementStatus:
      saved.settlementStatus

  };


  paymentCount =
    saved.paymentCount || 0;


  paymentHistory =
    saved.paymentHistory || [];


  document.getElementById(
    "finance"
  ).value =
    saved.finance || "";


  document.getElementById(
    "loan"
  ).value =
    saved.loan || "";


  document.getElementById(
    "rate"
  ).value =
    saved.rate || "";


  document.getElementById(
    "tenure"
  ).value =
    saved.tenure || "";


  document.getElementById(
    "settlement"
  ).value =
    saved.settlementAmount || "";


  if(saved.settlementStatus){

    document.getElementById(
      "settlementStatus"
    ).value =
      saved.settlementStatus;

  }


  showSavedLoan();

  showSavedPayment();

  showSavedSettlement();

  renderHistory();

}


function showSavedLoan(){

  if(!loanData){
    return;
  }


  document.getElementById(
    "loanResult"
  ).innerHTML = `

    <div class="result">

      <strong>Finance:</strong>
      ${loanData.finance}

      <br>

      <strong>Monthly EMI:</strong>
      ₹${loanData.emi.toFixed(2)}

      <br>

      <strong>Total Payment:</strong>
      ₹${loanData.total.toFixed(2)}

      <br>

      <strong>Total Interest:</strong>
      ₹${(
        loanData.total -
        loanData.loan
      ).toFixed(2)}

      <br><br>

      <span class="success">
      ✓ Saved Loan Details
      </span>

    </div>

  `;

}


function showSavedPayment(){

  if(!loanData){
    return;
  }


  const remaining =
    loanData.tenure -
    paymentCount;


  const outstanding =
    remaining *
    loanData.emi;


  document.getElementById(
    "paymentResult"
  ).innerHTML = `

    <div class="result">

      <strong>Total Paid EMI:</strong>
      ${paymentCount}

      <br>

      <strong>Remaining EMI:</strong>
      ${remaining}

      <br>

      <strong>Estimated Outstanding:</strong>
      ₹${outstanding.toFixed(2)}

    </div>

  `;

}


function showSavedSettlement(){

  if(
    !loanData ||
    !loanData.settlementAmount
  ){

    return;

  }


  document.getElementById(
    "settlementResult"
  ).innerHTML = `

    <div class="result">

      <strong>
      Settlement Amount:
      </strong>

      ₹${Number(
        loanData.settlementAmount
      ).toFixed(2)}

      <br>

      <strong>
      Status:
      </strong>

      ${loanData.settlementStatus}

    </div>

  `;

}


function renderHistory(){

  const history =
    document.getElementById(
      "history"
    );


  if(paymentHistory.length === 0){

    history.innerHTML =
      "No payments recorded yet.";

    return;

  }


  history.innerHTML = "";


  paymentHistory.forEach(item=>{

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "history";


    div.innerHTML = `

      EMI payment recorded:
      ${item.amount} EMI(s)

      —
      ${item.date}

    `;


    history.appendChild(div);

  });

}


loadData();

</script>

</body>
</html>
