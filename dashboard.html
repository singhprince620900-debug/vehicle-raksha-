<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Raksha - Dashboard</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#0b3d91;
  color:white;
  padding:22px 18px;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:6px 0 0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.vehicle-card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.vehicle-number{
  font-size:23px;
  font-weight:bold;
  color:#0b3d91;
}

.vehicle-info{
  line-height:1.8;
  margin-top:10px;
}

.status{
  margin-top:12px;
  padding:12px;
  background:#e8f5e9;
  color:#2e7d32;
  border-radius:8px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.menu{
  background:white;
  border:0;
  border-radius:14px;
  padding:20px 10px;
  min-height:115px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  cursor:pointer;
}

.icon{
  display:block;
  font-size:30px;
  margin-bottom:8px;
}

.title{
  font-weight:bold;
}

.subtitle{
  font-size:12px;
  color:#666;
  margin-top:5px;
}

.section-title{
  margin:22px 0 12px;
}

.add{
  background:#0b3d91;
  color:white;
}

.empty{
  background:white;
  padding:20px;
  border-radius:14px;
  text-align:center;
  margin-bottom:20px;
}
</style>
</head>

<body>

<header>
<h1>🚗 Vehicle Raksha</h1>
<p>All-in-one Vehicle Safety & Management</p>
</header>

<div class="container">

<div id="vehicleArea"></div>

<h2 class="section-title">
Vehicle Management
</h2>

<div class="grid">

<button class="menu" onclick="openPage('add-vehicle.html')">
<span class="icon">🚘</span>
<div class="title">Add Vehicle</div>
<div class="subtitle">Register vehicle</div>
</button>

<button class="menu" onclick="openPage('documents.html')">
<span class="icon">📄</span>
<div class="title">Documents</div>
<div class="subtitle">RC • Insurance • PUC</div>
</button>

<button class="menu" onclick="openPage('document-details.html')">
<span class="icon">📅</span>
<div class="title">Expiry & Reminders</div>
<div class="subtitle">Document validity</div>
</button>

<button class="menu" onclick="openPage('emi-settlement.html')">
<span class="icon">💰</span>
<div class="title">EMI & Settlement</div>
<div class="subtitle">Loan & payments</div>
</button>

<button class="menu" onclick="openPage('case-management.html')">
<span class="icon">🛡️</span>
<div class="title">Case Management</div>
<div class="subtitle">Cases & timeline</div>
</button>

<button class="menu" onclick="support()">
<span class="icon">📞</span>
<div class="title">Help & Support</div>
<div class="subtitle">Get assistance</div>
</button>

</div>

<h2 class="section-title">
Quick Actions
</h2>

<div class="grid">

<button class="menu" onclick="openPage('documents.html')">
<span class="icon">📷</span>
<div class="title">Upload Document</div>
<div class="subtitle">Photo / PDF</div>
</button>

<button class="menu" onclick="openPage('emi-settlement.html')">
<span class="icon">🧮</span>
<div class="title">Calculate EMI</div>
<div class="subtitle">Instant calculation</div>
</button>

</div>

</div>

<script>

function openPage(page){
  window.location.href=page;
}

function support(){
  alert(
    "Vehicle Raksha Support\n\nSupport module will be connected in the next version."
  );
}

function loadVehicle(){

  const saved=
    localStorage.getItem("vehicleRakshaVehicle");

  const area=
    document.getElementById("vehicleArea");

  if(!saved){

    area.innerHTML=`
      <div class="empty">
        <h3>🚘 No Vehicle Added</h3>
        <p>Add your vehicle to start managing documents, EMI and cases.</p>
        <button class="menu add"
          onclick="openPage('add-vehicle.html')">
          Add Your Vehicle
        </button>
      </div>
    `;

    return;
  }

  const vehicle=
    JSON.parse(saved);

  area.innerHTML=`

    <div class="vehicle-card">

      <div class="vehicle-number">
        ${vehicle.vehicleNumber}
      </div>

      <div class="vehicle-info">

        <strong>Owner:</strong>
        ${vehicle.owner}

        <br>

        <strong>Vehicle:</strong>
        ${vehicle.make} ${vehicle.model}

        <br>

        <strong>Fuel:</strong>
        ${vehicle.fuel || "Not specified"}

        <br>

        <strong>Finance:</strong>
        ${vehicle.finance || "No finance company"}

        <br>

        <strong>EMI Status:</strong>
        ${vehicle.emiStatus}

      </div>

      <div class="status">
        🟢 Vehicle Active
      </div>

    </div>
  `;
}

loadVehicle();

</script>

</body>
</html>
