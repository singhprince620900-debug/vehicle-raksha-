<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Raksha - Dashboard</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#0b3d91;
  color:white;
  padding:22px 18px;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:6px 0 0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.section-title{
  margin:20px 0 12px;
}

.vehicle-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.vehicle-card{
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.vehicle-card.selected{
  border:2px solid #0b3d91;
}

.vehicle-number{
  font-size:21px;
  font-weight:bold;
  color:#0b3d91;
}

.info{
  line-height:1.8;
  margin-top:8px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#0b3d91;
  color:white;
  font-size:15px;
  margin-top:10px;
}

.add{
  background:#2e7d32;
}

.selected-button{
  background:#555;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.menu{
  background:white;
  color:#222;
  min-height:110px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.icon{
  display:block;
  font-size:30px;
  margin-bottom:7px;
}

.title{
  font-weight:bold;
}

.subtitle{
  color:#666;
  font-size:12px;
  margin-top:5px;
}

.empty{
  background:white;
  padding:20px;
  text-align:center;
  border-radius:14px;
}

.status{
  margin-top:10px;
  padding:10px;
  background:#e8f5e9;
  color:#2e7d32;
  border-radius:8px;
  font-weight:bold;
}

footer{
  text-align:center;
  color:#777;
  padding:25px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
<h1>🚗 Vehicle Raksha</h1>
<p>All-in-one Vehicle Safety & Management</p>
</header>

<div class="container">

<h2 class="section-title">📊 Vehicle Alerts</h2>

<div id="dashboardAlerts"></div> 

<h2 class="section-title">🚘 My Vehicles</h2>

<div id="vehicleList" class="vehicle-list"></div>

<button class="add" onclick="goAddVehicle()">
<button
onclick="openPage('vehicle-overview.html')">

📊 Vehicle Overview

</button>
➕ Add New Vehicle
</button>


<h2 class="section-title">Vehicle Management</h2>

<div class="grid">

<button class="menu" onclick="openPage('case-management-v2.html')">
<span class="icon">📄</span>
<div class="title">Documents</div>
<div class="subtitle">RC • Insurance • PUC</div>
</button>

<button class="menu" onclick="openPage('emi-settlement-v2.html
')">
<span class="icon">📅</span>
<div class="title">Expiry & Reminders</div>
<div class="subtitle">Document validity</div>
</button>

<button class="menu" onclick="openPage('emi-settlement.html')">
<span class="icon">💰</span>
<div class="title">EMI & Settlement</div>
<div class="subtitle">Loan & payments</div>
</button>

<button class="menu" onclick="openPage('case-management.html')">
<span class="icon">🛡️</span>
<div class="title">Case Management</div>
<div class="subtitle">Cases & timeline</div>
</button>

</div>


<h2 class="section-title">Quick Actions</h2>

<div class="grid">

<button class="menu" onclick="openPage('documents.html')">
<span class="icon">📷</span>
<div class="title">Upload Document</div>
<div class="subtitle">Photo / PDF</div>
</button>

<button class="menu" onclick="openPage('emi-settlement.html')">
<span class="icon">🧮</span>
<div class="title">Calculate EMI</div>
<div class="subtitle">Instant calculation</div>
</button>

</div>

</div>

<footer>
Vehicle Raksha<br>
Vehicle Safety & Management System
</footer>


<script>

function getVehicles(){

return JSON.parse(
localStorage.getItem("vehicleRakshaVehicles") || "[]"
);

}


function getSelected(){

return localStorage.getItem(
"vehicleRakshaSelected"
);

}


function selectVehicle(id){

localStorage.setItem(
"vehicleRakshaSelected",
id
);

loadVehicles();

}


function loadVehicles(){

const vehicles=getVehicles();

const selected=getSelected();

const list=
document.getElementById("vehicleList");

if(vehicles.length===0){

list.innerHTML=`

<div class="empty">

<h3>🚘 No Vehicle Added</h3>

<p>
Add your first vehicle to start Vehicle Raksha.
</p>

</div>

`;

return;

}

list.innerHTML="";

vehicles.forEach(vehicle=>{

const isSelected=
String(vehicle.id)===String(selected);

const card=
document.createElement("div");

card.className=
"vehicle-card"+
(isSelected ? " selected" : "");

card.innerHTML=`

<div class="vehicle-number">
${vehicle.vehicleNumber}
</div>

<div class="info">

<strong>Owner:</strong>
${vehicle.owner}

<br>

<strong>Vehicle:</strong>
${vehicle.make} ${vehicle.model}

<br>

<strong>Fuel:</strong>
${vehicle.fuel || "Not specified"}

<br>

<strong>Finance:</strong>
${vehicle.finance || "No finance company"}

<br>

<strong>EMI:</strong>
${vehicle.emiStatus}

</div>

${
isSelected
?
'<div class="status">✓ Selected Vehicle</div>'
:
''
}

<button
class="${isSelected ? 'selected-button' : ''}"
onclick="selectVehicle(${vehicle.id})">

${isSelected ? '✓ Selected' : 'Select Vehicle'}

</button>

`;

list.appendChild(card);

});

}


function goAddVehicle(){

window.location.href="add-vehicle.html";

}


function openPage(page){

const vehicles=getVehicles();

if(vehicles.length===0){

alert(
"Please add a vehicle first."
);

return;

}

window.location.href=page;

}


loadVehicles();

</script>

</body>
</html>
